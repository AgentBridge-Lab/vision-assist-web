# Cloudflare Workers 배포 설정
# 주의: 이 파일에 OPENAI_API_KEY를 적지 마십시오. 키는 secret으로만 넣습니다.
#   npx wrangler secret put OPENAI_API_KEY
name = "vision-assist-proxy"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
# 실제 호출을 켜는 스위치. 키가 secret으로 들어가 있어야 함께 동작합니다.
USE_OPENAI = "1"

# 프런트 주소만 허용합니다. 다른 사이트가 이 프록시를 쓰지 못하게 막는 설정입니다.
ALLOWED_ORIGIN = "https://agentbridge-lab.github.io"

# 월 예산 상한(달러). 당사자 시험 단계용으로 5달러에서 시작합니다 (D-1 결정, 2026-11-16).
# 소진되면 구름 모드가 멈추고 문서 읽기만 남습니다. 공개를 넓힐 때 올리십시오.
MONTHLY_BUDGET_USD = "5"

# 한도 (기획서 2-4절)
SESSION_LIMIT = "40"
DEVICE_DAILY_LIMIT = "100"
DEVICE_DAILY_LIMIT_REDUCED = "40"
IP_DAILY_LIMIT = "600"

# 모델과 단가. 단가는 과금 계산에만 쓰이며 실제 청구는 OpenAI 기준입니다.
OPENAI_MODEL = "gpt-5.6-luna"
PRICE_INPUT_PER_M = "0.20"
PRICE_OUTPUT_PER_M = "1.20"

# 한도·비용 계수를 여러 요청 사이에 공유하기 위한 저장소입니다.
# 이 바인딩이 없으면 계수가 메모리에만 남아 실제 운영에서 한도가 새어 나갑니다.
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "LimitCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LimitCounter"]
