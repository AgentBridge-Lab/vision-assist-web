<!doctype html>
<html lang="ko"><meta charset="utf-8">
<title>PaddleOCR bench</title>
<!--
  측정 전용 시험대 — 기획서 v2 로드맵 1단계 V3의 두 번째 OCR 후보(PaddleOCR PP-OCRv5 + ONNX Runtime Web).
  앱에는 들어가지 않습니다. js/ocr.js(Tesseract 경로)와 무관하며, 결정 사항 D-4는 측정 뒤에 정합니다.
  test/ocr-bench.html과 같은 이미지(/img/manifest.json 42장), 같은 정답(/img/ground_truth.json), 같은 지표를 씁니다.

  내려받는 것(모두 Apache-2.0, 설치 없음):
    onnxruntime-web 1.20.1 (cdn.jsdelivr.net)                         ort.min.js, ort-wasm-simd-threaded.mjs/.wasm
    PaddlePaddle/PP-OCRv5_mobile_det_onnx          inference.onnx     글자 검출기
    PaddlePaddle/korean_PP-OCRv5_mobile_rec_onnx   inference.onnx     한국어 인식기
    monkt/paddleocr-onnx  languages/korean/dict.txt                   한국어 사전(인식기 inference.yml의 character_dict와 11,945줄 전부 같음을 확인)

  전처리·후처리 값의 출처
    [yml]  각 모델의 inference.yml에서 읽은 값
    [코드] inference.yml에 없어 PaddleOCR 공개 구현(RecResizeImg, DBPostProcess, get_rotate_crop_image)의 동작을 옮긴 것.
           구현자가 기억에 의존해 옮겼고 PaddleOCR 원본과 숫자 단위로 대조하지는 않았습니다.
-->
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
<body>
<pre id="log">시작 대기…</pre>
<script type="module">
const ORT_DIST = 'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
const HF = 'https://huggingface.co/';
const SOURCES = [
  { name: 'ort.min.js', url: ORT_DIST + 'ort.min.js' },
  { name: 'ort-wasm-simd-threaded.mjs', url: ORT_DIST + 'ort-wasm-simd-threaded.mjs' },
  { name: 'ort-wasm-simd-threaded.wasm', url: ORT_DIST + 'ort-wasm-simd-threaded.wasm' },
  { name: 'det inference.onnx', url: HF + 'PaddlePaddle/PP-OCRv5_mobile_det_onnx/resolve/main/inference.onnx' },
  { name: 'rec inference.onnx', url: HF + 'PaddlePaddle/korean_PP-OCRv5_mobile_rec_onnx/resolve/main/inference.onnx' },
  { name: 'dict.txt', url: HF + 'monkt/paddleocr-onnx/resolve/main/languages/korean/dict.txt' },
];

// 검출기 [yml] PP-OCRv5_mobile_det inference.yml
const DET = { resizeLong: 960, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225], thresh: 0.3, boxThresh: 0.6, unclipRatio: 1.5,
  stride: 32,      // [코드] 입력 변은 32의 배수
  minSize: 3 };    // [코드] DBPostProcess min_size
// 인식기 [yml] korean_PP-OCRv5_mobile_rec inference.yml: image_shape 3×48×320, img_mode BGR
const REC = { height: 48, baseWidth: 320,
  mean: 0.5, std: 0.5 };  // [코드] RecResizeImg: (x/255 - 0.5) / 0.5. inference.yml에는 정규화 값이 적혀 있지 않습니다

const log = (s) => { document.getElementById('log').textContent += '\n' + s; };

/** 글자 오류율(CER) = 편집거리 / 정답 길이 — ocr-bench.html과 같은 계산 */
function cer(truth, got) {
  const a = truth.replace(/\s+/g, ''), b = (got || '').replace(/\s+/g, '');
  const m = a.length, n = b.length;
  const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
    d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return m === 0 ? (n === 0 ? 0 : 1) : d[m][n] / m;
}

async function toCanvas(url) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  return c;
}

/** 내려받고 실제 바이트 수를 셉니다. bytes는 압축을 푼 본문 크기입니다. */
async function download(src) {
  const res = await fetch(src.url);
  if (!res.ok) throw new Error(`내려받기 실패 ${res.status}: ${src.name}`);
  const buf = await res.arrayBuffer();
  return { name: src.name, url: src.url, bytes: buf.byteLength, commit: res.headers.get('x-repo-commit') || null, buf };
}

// ── 검출: DB 후처리 ────────────────────────────────────────────────────────
/** 볼록 껍질(단조 사슬). pts: [x,y][] */
function convexHull(pts) {
  pts.sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const p of pts) { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); }
  for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); }
  lower.pop(); upper.pop();
  return lower.concat(upper);
}

/** 최소 넓이 회전 사각형. 기울어진 글줄을 기울어진 채로 감쌉니다(= 기울기 보정의 입력). 반환: 네 꼭짓점과 두 변의 길이 */
function minAreaRect(hull) {
  if (hull.length < 3) {
    const xs = hull.map((p) => p[0]), ys = hull.map((p) => p[1]);
    const x0 = Math.min(...xs), x1 = Math.max(...xs) + 1, y0 = Math.min(...ys), y1 = Math.max(...ys) + 1;
    return { pts: [[x0, y0], [x1, y0], [x1, y1], [x0, y1]], w: x1 - x0, h: y1 - y0 };
  }
  let best = null;
  for (let i = 0; i < hull.length; i++) {
    const a = hull[i], b = hull[(i + 1) % hull.length];
    const len = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (!len) continue;
    const ux = (b[0] - a[0]) / len, uy = (b[1] - a[1]) / len;   // 변 방향
    let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity;
    for (const p of hull) {
      const u = p[0] * ux + p[1] * uy, v = -p[0] * uy + p[1] * ux;
      if (u < minU) minU = u; if (u > maxU) maxU = u; if (v < minV) minV = v; if (v > maxV) maxV = v;
    }
    const w = maxU - minU, h = maxV - minV;
    if (!best || w * h < best.area) best = { area: w * h, ux, uy, minU, maxU, minV, maxV, w, h };
  }
  const { ux, uy, minU, maxU, minV, maxV } = best;
  const at = (u, v) => [u * ux - v * uy, u * uy + v * ux];
  return { pts: [at(minU, minV), at(maxU, minV), at(maxU, maxV), at(minU, maxV)], w: best.w, h: best.h };
}

/** [코드] get_mini_boxes: 꼭짓점을 x로 정렬해 왼위·오른위·오른아래·왼아래 순서로 */
function orderBox(pts) {
  const s = [...pts].sort((a, b) => a[0] - b[0]);
  const [l1, l2] = s[0][1] <= s[1][1] ? [s[0], s[1]] : [s[1], s[0]];
  const [r1, r2] = s[2][1] <= s[3][1] ? [s[2], s[3]] : [s[3], s[2]];
  return [l1, r1, r2, l2]; // tl, tr, br, bl
}

/** 사각형을 바깥으로 d만큼 넓힙니다(사각형의 다각형 오프셋). [코드] unclip: d = 넓이 × unclip_ratio / 둘레 */
function unclip(box, ratio) {
  const [tl, tr, br, bl] = box;
  const w = Math.hypot(tr[0] - tl[0], tr[1] - tl[1]), h = Math.hypot(bl[0] - tl[0], bl[1] - tl[1]);
  if (!w || !h) return box;
  const d = (w * h * ratio) / (2 * (w + h));
  const ux = (tr[0] - tl[0]) / w, uy = (tr[1] - tl[1]) / w, vx = (bl[0] - tl[0]) / h, vy = (bl[1] - tl[1]) / h;
  const mv = (p, a, b) => [p[0] + a * ux * d + b * vx * d, p[1] + a * uy * d + b * vy * d];
  return [mv(tl, -1, -1), mv(tr, 1, -1), mv(br, 1, 1), mv(bl, -1, 1)];
}

/** 검출기 실행 → 원본 좌표의 글줄 사각형 목록 */
async function detect(session, canvas) {
  const sw = canvas.width, sh = canvas.height;
  const ratio = DET.resizeLong / Math.max(sw, sh);                       // [yml] resize_long: 960
  const rw = Math.max(DET.stride, Math.round((sw * ratio) / DET.stride) * DET.stride);
  const rh = Math.max(DET.stride, Math.round((sh * ratio) / DET.stride) * DET.stride);
  const c = document.createElement('canvas'); c.width = rw; c.height = rh;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(canvas, 0, 0, rw, rh);
  const px = ctx.getImageData(0, 0, rw, rh).data;
  const n = rw * rh, input = new Float32Array(3 * n);
  for (let i = 0; i < n; i++) {
    // [yml] img_mode: BGR, scale 1/255, mean·std는 채널 순서 그대로 적용, CHW
    input[i] = (px[i * 4 + 2] / 255 - DET.mean[0]) / DET.std[0];
    input[n + i] = (px[i * 4 + 1] / 255 - DET.mean[1]) / DET.std[1];
    input[2 * n + i] = (px[i * 4] / 255 - DET.mean[2]) / DET.std[2];
  }
  const out = await session.run({ [session.inputNames[0]]: new ort.Tensor('float32', input, [1, 3, rh, rw]) });
  const prob = out[session.outputNames[0]].data; // [1,1,rh,rw]

  // 이진화([yml] thresh 0.3) → 연결 요소(8방향) → 최소 넓이 사각형 → 점수([yml] box_thresh 0.6) → 넓히기([yml] unclip_ratio 1.5)
  const seen = new Uint8Array(n), boxes = [], stack = new Int32Array(n);
  for (let start = 0; start < n; start++) {
    if (seen[start] || prob[start] <= DET.thresh) continue;
    let top = 0; stack[top++] = start; seen[start] = 1;
    const pts = []; let sum = 0;
    while (top) {
      const p = stack[--top], x = p % rw, y = (p - x) / rw;
      pts.push([x, y]); sum += prob[p];
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= rw || ny >= rh) continue;
        const q = ny * rw + nx;
        if (!seen[q] && prob[q] > DET.thresh) { seen[q] = 1; stack[top++] = q; }
      }
    }
    const score = sum / pts.length; // [코드] 원본은 사각형 안 평균(box_score_fast). 여기서는 요소 화소 평균 — 약간 높게 나옵니다
    const rect = minAreaRect(convexHull(pts));
    if (Math.min(rect.w, rect.h) < DET.minSize || score < DET.boxThresh) continue;
    const big = unclip(orderBox(rect.pts), DET.unclipRatio);
    const w = Math.hypot(big[1][0] - big[0][0], big[1][1] - big[0][1]), h = Math.hypot(big[3][0] - big[0][0], big[3][1] - big[0][1]);
    if (Math.min(w, h) < DET.minSize + 2) continue;
    // 원본 좌표로
    boxes.push({ score, pts: orderBox(big.map(([x, y]) => [(x * sw) / rw, (y * sh) / rh])) });
  }
  // [코드] sorted_boxes: 위에서 아래로, 같은 줄(10px 이내)은 왼쪽부터
  boxes.sort((a, b) => a.pts[0][1] - b.pts[0][1] || a.pts[0][0] - b.pts[0][0]);
  for (let i = 0; i < boxes.length - 1; i++) for (let j = i; j >= 0; j--) {
    if (Math.abs(boxes[j + 1].pts[0][1] - boxes[j].pts[0][1]) < 10 && boxes[j + 1].pts[0][0] < boxes[j].pts[0][0]) [boxes[j], boxes[j + 1]] = [boxes[j + 1], boxes[j]];
    else break;
  }
  return boxes;
}

/**
 * 기울기 보정: 기울어진 사각형을 똑바로 편 조각으로 잘라 냅니다. [코드] get_rotate_crop_image
 * 사각형이므로 아핀 변환으로 정확히 펴집니다. 세로로 긴 조각(높이/너비 ≥ 1.5)은 90° 돌립니다.
 * 주의: 180° 뒤집힌 글줄을 바로잡는 방향 분류기(textline orientation)는 넣지 않았습니다.
 */
function cropBox(canvas, pts) {
  const [tl, tr, , bl] = pts;
  const W = Math.max(1, Math.round(Math.hypot(tr[0] - tl[0], tr[1] - tl[1])));
  const H = Math.max(1, Math.round(Math.hypot(bl[0] - tl[0], bl[1] - tl[1])));
  // 원본 = tl + x·u + y·v  (u, v는 조각의 가로·세로 한 화소가 원본에서 움직이는 양). 캔버스에는 그 역변환을 줍니다
  const ux = (tr[0] - tl[0]) / W, uy = (tr[1] - tl[1]) / W, vx = (bl[0] - tl[0]) / H, vy = (bl[1] - tl[1]) / H;
  const det = ux * vy - uy * vx;
  const a = vy / det, b = -uy / det, c2 = -vx / det, d = ux / det;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.setTransform(a, b, c2, d, -(a * tl[0] + c2 * tl[1]), -(b * tl[0] + d * tl[1]));
  ctx.drawImage(canvas, 0, 0);
  const angle = (Math.atan2(tr[1] - tl[1], tr[0] - tl[0]) * 180) / Math.PI;
  if (H / W < 1.5) return { canvas: c, angle };
  const r = document.createElement('canvas'); r.width = H; r.height = W;
  const rc = r.getContext('2d');
  rc.translate(0, W); rc.rotate(-Math.PI / 2); rc.drawImage(c, 0, 0);
  return { canvas: r, angle: angle - 90 };
}

// ── 인식: CTC ──────────────────────────────────────────────────────────────
/** 조각 하나 → 글자와 신뢰도. 신뢰도 = 남긴 글자 위치들의 최대 확률 평균(0~1). [코드] CTCLabelDecode */
async function recognize(session, chars, crop) {
  const ratio = crop.width / crop.height;
  const imgW = Math.max(REC.baseWidth, Math.ceil(REC.height * ratio));      // [yml] 3×48×320, 긴 글줄은 너비를 늘림 [코드]
  const rw = Math.min(imgW, Math.max(1, Math.ceil(REC.height * ratio)));
  const c = document.createElement('canvas'); c.width = rw; c.height = REC.height;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(crop, 0, 0, rw, REC.height);
  const px = ctx.getImageData(0, 0, rw, REC.height).data;
  const plane = REC.height * imgW, input = new Float32Array(3 * plane); // 오른쪽 남는 곳은 0으로 채움 [코드]
  for (let y = 0; y < REC.height; y++) for (let x = 0; x < rw; x++) {
    const s = (y * rw + x) * 4, t = y * imgW + x;
    input[t] = (px[s + 2] / 255 - REC.mean) / REC.std;            // B  [yml] img_mode: BGR
    input[plane + t] = (px[s + 1] / 255 - REC.mean) / REC.std;    // G
    input[2 * plane + t] = (px[s] / 255 - REC.mean) / REC.std;    // R
  }
  const out = await session.run({ [session.inputNames[0]]: new ort.Tensor('float32', input, [1, 3, REC.height, imgW]) });
  const t = out[session.outputNames[0]];
  const [, T, C] = t.dims, data = t.data;
  // 사전 + 빈칸(0번) + 띄어쓰기(마지막). 개수가 맞지 않으면 추측하지 않고 멈춥니다
  if (C !== chars.length) throw new Error(`인식기 출력 클래스 수 ${C} ≠ 사전 ${chars.length - 2} + 2`);
  let text = '', sum = 0, kept = 0, prev = 0;
  for (let i = 0; i < T; i++) {
    let best = 0, bestP = -Infinity, total = 0;
    for (let k = 0; k < C; k++) { const p = data[i * C + k]; total += p; if (p > bestP) { bestP = p; best = k; } }
    if (i === 0 && Math.abs(total - 1) > 0.05) throw new Error(`인식기 출력이 확률이 아님(첫 위치 합 ${total.toFixed(3)}). softmax 여부 확인 필요`);
    if (best !== 0 && best !== prev) { text += chars[best]; sum += bestP; kept++; }
    prev = best;
  }
  return { text, conf: kept ? sum / kept : 0 };
}

(async () => {
  const manifest = await (await fetch('/img/manifest.json')).json();
  const truth = await (await fetch('/img/ground_truth.json')).json();

  log('런타임과 모델 내려받는 중…');
  const t0 = performance.now();
  const got = await Promise.all(SOURCES.map(download));
  const by = Object.fromEntries(got.map((g) => [g.name, g]));
  const totalBytes = got.reduce((s, g) => s + g.bytes, 0);
  for (const g of got) log(`  ${g.name}: ${g.bytes.toLocaleString()} 바이트${g.commit ? ' (commit ' + g.commit.slice(0, 8) + ')' : ''}`);

  // 스레드 1개: 이 페이지는 교차 출처 격리 머리말(COOP/COEP) 없이 열리므로 다중 스레드를 쓸 수 없습니다. GitHub Pages 배포본도 같은 조건입니다
  ort.env.wasm.numThreads = 1;
  ort.env.wasm.wasmPaths = ORT_DIST;
  ort.env.wasm.wasmBinary = by['ort-wasm-simd-threaded.wasm'].buf;
  const opt = { executionProviders: ['wasm'] };
  const detSession = await ort.InferenceSession.create(new Uint8Array(by['det inference.onnx'].buf), opt);
  const recSession = await ort.InferenceSession.create(new Uint8Array(by['rec inference.onnx'].buf), opt);
  const dict = new TextDecoder().decode(by['dict.txt'].buf).replace(/\r/g, '').split('\n');
  if (dict[dict.length - 1] === '') dict.pop();
  const chars = ['', ...dict, ' ']; // 0번 = CTC 빈칸, 마지막 = 띄어쓰기 [코드] use_space_char
  const initMs = Math.round(performance.now() - t0);
  // 전송 바이트(압축된 채로 오간 크기). 브라우저가 알려 주는 것만 더합니다. 0이면 캐시에서 왔거나 알려 주지 않은 것입니다
  const timing = performance.getEntriesByType('resource');
  const transfer = got.map((g) => { const e = timing.filter((x) => x.name === g.url).pop(); return e ? e.transferSize : 0; });
  const transferBytes = transfer.reduce((a, b) => a + b, 0);
  log(`초기화 완료 ${initMs}ms · 내려받은 본문 합계 ${totalBytes.toLocaleString()} 바이트 (${(totalBytes / 1048576).toFixed(1)}MB) · 사전 ${dict.length}자`);

  const rows = [];
  for (const item of manifest) {
    const canvas = await toCanvas('/img/deg/' + item.file);
    const t = performance.now();
    let text = '', err = null, conf = null, lines = [];
    try {
      const boxes = await detect(detSession, canvas);
      for (const box of boxes) {
        const crop = cropBox(canvas, box.pts);
        const r = await recognize(recSession, chars, crop.canvas);
        if (!r.text.trim()) continue;
        lines.push({ t: r.text, c: Math.round(r.conf * 100), det: Number(box.score.toFixed(2)), angle: Number(crop.angle.toFixed(1)) });
      }
      text = lines.map((l) => l.t).join(' ');
      conf = lines.length ? lines.reduce((s, l) => s + l.c, 0) / lines.length : 0; // 줄 신뢰도 평균(0~100). 글줄을 못 찾으면 0
    } catch (e) { err = String(e && e.message || e); }
    const ms = Math.round(performance.now() - t);
    const gt = truth[item.key];
    const norm = (s) => (s || '').replace(/\s+/g, '');
    rows.push({ key: item.key, deg: item.deg, ms, err, conf: conf === null ? null : Math.round(conf), lines,
      truth: gt, got: text.trim(),
      exact: norm(text) === norm(gt),
      cer: Number(cer(gt, text).toFixed(3)) });
    log(`${item.key}/${item.deg} conf=${conf === null ? '-' : Math.round(conf)} boxes=${lines.length} angle=${lines.map((l) => l.angle).join(',') || '-'} exact=${norm(text) === norm(gt)} cer=${cer(gt, text).toFixed(3)} ${ms}ms "${text.trim().slice(0, 36)}"${err ? ' ERROR ' + err : ''}`);
  }
  const ok = rows.filter((r) => !r.err);
  log(`\n요약: 정확 일치 ${rows.filter((r) => r.exact).length}/${rows.length} · 평균 CER ${(rows.reduce((s, r) => s + r.cer, 0) / rows.length).toFixed(3)} · 장당 평균 ${Math.round(ok.reduce((s, r) => s + r.ms, 0) / Math.max(1, ok.length))}ms · 오류 ${rows.length - ok.length}건`);
  await fetch('/result', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ engine: 'PaddleOCR PP-OCRv5 mobile det + korean rec / onnxruntime-web 1.20.1 wasm 1 thread',
      initMs, totalBytes, transferBytes,
      downloads: got.map((g, i) => ({ name: g.name, bytes: g.bytes, transferBytes: transfer[i], commit: g.commit })), rows }) });
  log('완료. 결과 전송함.');
  document.title = 'DONE';
})().catch((e) => { log('ERROR: ' + (e && e.stack || e)); document.title = 'ERROR'; });
</script>
